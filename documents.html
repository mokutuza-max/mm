<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Официальные документы Министерства Обороны Кутузовского Федерального Округа.">
    <title>Документы — МО Кутузовского ФО</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section class="top" data-bg="doc">
            <div class="wrap">
                <p class="eyebrow">Официальные материалы</p>
                <h1>Документы</h1>
                <p>Устав, регламенты, кадровые требования и иные документы ведомства.</p>
            </div>
        </section>
        <section class="s">
            <div class="wrap">
                <div class="adminbar">
                    <input id="docSearch" type="search" placeholder="Поиск по названию или категории">
                    <span class="admincount" id="docCount"></span>
                </div>
                <div id="docList" aria-live="polite">
                    <div class="empty">Загрузка документов…</div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/documents.js"></script>
</body>

</html>
